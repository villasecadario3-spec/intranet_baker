<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organigrama — Baker</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.11.1/lib/msal-browser.min.js"></script>
<style>
:root{
  --bg:#0a0a0b;--surface:#111113;--surface2:#18181b;
  --border:#27272a;--border2:#3f3f46;
  --text:#fafafa;--text2:#a1a1aa;--text3:#52525b;
  --gold:#cc9166;--gold2:#ae9357;--gold-light:rgba(204,145,102,0.10);
  --radius:10px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:auto}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(10,10,11,0.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;padding:0 40px;gap:16px}
.nav-logo img{height:26px;background:white;border-radius:6px;padding:4px 10px;display:block}
.nav-sep{width:1px;height:18px;background:var(--border)}
.nav-back{display:flex;align-items:center;gap:6px;color:var(--text2);text-decoration:none;font-size:0.78rem;font-weight:500;transition:color 0.2s}
.nav-back:hover{color:var(--text)}
.nav-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.nav-title{font-size:0.72rem;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;font-family:"DM Mono",monospace}
.nav-spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;background:var(--surface2);border:1px solid var(--border);border-radius:100px}
.user-av{width:26px;height:26px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;color:#000}
.user-nm{font-size:0.78rem;font-weight:500;color:var(--text);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* LOADING */
#auth-loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999}
.spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#auth-loading p{font-size:14px;color:var(--text2)}
#app-content{display:none}

/* MAIN */
main{padding:2rem}

/* HERO */
.hero{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.hero-left h1{font-size:22px;font-weight:600;letter-spacing:-0.03em}
.hero-left p{font-size:13px;color:var(--text2);margin-top:4px}
.hero-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* SEARCH */
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:0 12px;height:36px;transition:border-color 0.15s}
.search-box:focus-within{border-color:var(--gold)}
.search-box svg{width:14px;height:14px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}
.search-box input{background:none;border:none;outline:none;font-size:13px;font-family:"DM Sans",sans-serif;color:var(--text);width:180px}
.search-box input::placeholder{color:var(--text3)}

/* CONTROLS */
.btn-ctrl{display:flex;align-items:center;gap:5px;padding:0 12px;height:36px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text2);font-size:12px;font-weight:500;font-family:"DM Sans",sans-serif;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.btn-ctrl:hover{border-color:var(--gold);color:var(--gold)}
.btn-ctrl svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* STATS */
.stats{display:flex;gap:10px;margin-bottom:1.5rem;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 18px}
.stat-val{font-size:20px;font-weight:600;letter-spacing:-0.04em;color:var(--gold)}
.stat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;font-family:"DM Mono",monospace;margin-top:2px}

/* ── ÁRBOL HORIZONTAL ────────────────────────────────────── */
.tree-wrap{overflow-x:auto;overflow-y:auto;padding:2rem 1rem 3rem}

.tree-level{display:flex;flex-direction:column;align-items:center}

/* Contenedor de un nodo + sus hijos */
.tree-node-wrap{display:flex;flex-direction:column;align-items:center;position:relative}

/* Línea vertical que baja del nodo a la barra horizontal */
.tree-node-wrap.has-children > .node-card::after{
  content:'';position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);
  width:2px;height:20px;background:var(--border2);
}

/* Barra horizontal que conecta hijos */
.tree-children{display:flex;flex-direction:row;align-items:flex-start;gap:0;position:relative;margin-top:20px}

/* Línea horizontal encima de los hijos */
.tree-children::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  height:2px;background:var(--border2);
  /* ancho se define por JS con variable CSS */
  width:var(--bar-width, 80%);
}

/* Línea vertical que sube desde cada hijo */
.tree-child-wrap{display:flex;flex-direction:column;align-items:center;padding:0 12px;position:relative}
.tree-child-wrap::before{
  content:'';width:2px;height:20px;background:var(--border2);flex-shrink:0;
}

/* NODO */
.node-card{
  display:flex;flex-direction:column;align-items:center;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px 12px;cursor:pointer;
  transition:border-color 0.15s,background 0.15s;
  position:relative;
  min-width:140px;max-width:170px;
  text-align:center;
}
.node-card:hover{border-color:var(--gold);background:var(--surface2)}
.node-card.raiz{border-color:var(--gold);background:var(--gold-light)}
.node-card.highlight{border-color:var(--gold);background:var(--gold-light)}
.node-card.vacante{opacity:0.5}
.node-card.collapsed-card{border-style:dashed}

.node-avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--border2);margin-bottom:8px;flex-shrink:0}
.node-avatar-placeholder{width:52px;height:52px;border-radius:50%;background:var(--surface2);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--gold);margin-bottom:8px;flex-shrink:0}
.node-name{font-size:12px;font-weight:600;line-height:1.3;color:var(--text)}
.node-job{font-size:10px;color:var(--text2);line-height:1.3;margin-top:3px}
.node-div{font-size:9px;color:var(--text3);margin-top:3px;font-family:"DM Mono",monospace}

/* Badge de hijos colapsados */
.node-badge{
  position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  background:var(--surface2);border:1px solid var(--border2);border-radius:100px;
  font-size:10px;font-family:"DM Mono",monospace;color:var(--text3);
  padding:1px 7px;white-space:nowrap;cursor:pointer;transition:all 0.15s;
}
.node-badge:hover{border-color:var(--gold);color:var(--gold)}

/* TOOLTIP */
.tooltip{position:fixed;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 14px;font-size:12px;pointer-events:none;z-index:500;max-width:240px;display:none;line-height:1.5}
.tooltip.show{display:block}
.tooltip-name{font-weight:600;color:var(--text);margin-bottom:2px}
.tooltip-job{color:var(--text2)}
.tooltip-area{color:var(--text3);font-size:11px;margin-top:3px}
</style>
</head>
<body>

<div id="auth-loading">
  <div class="spinner"></div>
  <p>Verificando acceso…</p>
</div>

<div id="app-content">
<nav>
  <a class="nav-logo" href="index.html">
    <img src="LOGO_BAKER.png" alt="Baker" onerror="this.outerHTML='<span style=\'font-weight:900;color:white\'>BAKER</span>'">
  </a>
  <div class="nav-sep"></div>
  <a class="nav-back" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Inicio
  </a>
  <div class="nav-sep"></div>
  <div class="nav-title">Organigrama</div>
  <div class="nav-spacer"></div>
  <div id="auth-area"></div>
</nav>

<main>
  <div class="hero">
    <div class="hero-left">
      <h1>Organigrama Grupo Baker</h1>
      <p id="hero-sub">Cargando…</p>
    </div>
    <div class="hero-right">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search-input" placeholder="Buscar persona o cargo…" oninput="buscar(this.value)">
      </div>
      <button class="btn-ctrl" onclick="expandirTodo()">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        Expandir todo
      </button>
      <button class="btn-ctrl" onclick="colapsarTodo()">
        <svg viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
        Colapsar
      </button>
    </div>
  </div>

  <div class="stats" id="stats-bar" style="display:none">
    <div class="stat"><div class="stat-val" id="stat-total">—</div><div class="stat-lbl">Colaboradores</div></div>
    <div class="stat"><div class="stat-val" id="stat-div">—</div><div class="stat-lbl">Divisiones</div></div>
  </div>

  <div class="tree-wrap" id="tree-wrap">
    <div style="display:flex;align-items:center;gap:12px;color:var(--text2);font-size:14px">
      <div class="spinner" style="width:20px;height:20px;border-width:2px"></div>
      Cargando organigrama…
    </div>
  </div>
</main>

<div class="tooltip" id="tooltip">
  <div class="tooltip-name" id="tt-name"></div>
  <div class="tooltip-job"  id="tt-job"></div>
  <div class="tooltip-area" id="tt-area"></div>
</div>
</div>

<script>
// ── MSAL AUTH ─────────────────────────────────────────────────
const ALLOWED = ['dvillaseca@ibaker.cl','jcumplido@ibaker.cl'];
const msalConfig = {
  auth:{clientId:'9a56ab1c-d3c4-4460-9892-1d4da768ecfb',authority:'https://login.microsoftonline.com/87c9a653-b08e-42c9-92bc-260458dffc26',redirectUri:window.location.origin+'/'},
  cache:{cacheLocation:'sessionStorage'}
};
let msalInstance = null;
window.addEventListener('load', async () => {
  msalInstance = new msal.PublicClientApplication(msalConfig);
  await msalInstance.initialize();
  await initAuth();
});
async function initAuth(){
  try{
    const resp = await msalInstance.handleRedirectPromise();
    let account = resp ? resp.account : msalInstance.getAllAccounts()[0];
    if(!account){ await msalInstance.loginRedirect({scopes:['User.Read']}); return; }
    const email = account.username.toLowerCase();
    if(!ALLOWED.includes(email)){
      document.getElementById('auth-loading').innerHTML='<div style="text-align:center;padding:2rem"><h2 style="color:#C0392B">Acceso no autorizado</h2></div>';
      return;
    }
    const ini = account.name ? account.name.split(' ').slice(0,2).map(n=>n[0]).join('').toUpperCase() : email[0].toUpperCase();
    document.getElementById('auth-area').innerHTML = `<div class="user-chip"><div class="user-av">${ini}</div><div class="user-nm">${account.name||email}</div></div>`;
    document.getElementById('auth-loading').style.display = 'none';
    document.getElementById('app-content').style.display  = 'block';
    cargarOrganigrama();
  }catch(e){ console.error(e); }
}

// ── NORMALIZAR ────────────────────────────────────────────────
function norm(n){
  const cargo = n.position_tooltip ||
    [n.position_first_line, n.position_second_line].filter(Boolean).join(' ');
  return {
    id:      n.id,
    nombre:  [n.name, n.last_name].filter(Boolean).join(' ') || 'Puesto Vacante',
    cargo,
    cargoL1: n.position_first_line  || '',
    cargoL2: n.position_second_line || '',
    area:    n.department  || '',
    div:     n.division    || '',
    foto:    (n.image && !n.image.startsWith('/images/')) ? n.image : null,
    activo:  n.isActive !== false,
    hijos:   (n.children || []).map(norm),
    _open:   true
  };
}

function contar(ns){ return ns.reduce((a,n)=>a+1+contar(n.hijos),0); }

// ── CARGAR ────────────────────────────────────────────────────
let raiz = null;
function cargarOrganigrama(){
  raiz = norm(DATOS_BUK);
  const total = 1 + contar(raiz.hijos);
  const divs  = new Set(); const rec = n=>{ if(n.div)divs.add(n.div); n.hijos.forEach(rec); }; rec(raiz);
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-div').textContent   = divs.size;
  document.getElementById('stats-bar').style.display = 'flex';
  document.getElementById('hero-sub').textContent    = `${total} colaboradores · Grupo Baker`;
  renderTree();
}

// ── RENDER ÁRBOL HORIZONTAL ───────────────────────────────────
function renderTree(){
  const wrap = document.getElementById('tree-wrap');
  wrap.innerHTML = '';
  wrap.appendChild(buildNode(raiz, true));
}

function buildNode(n, esRaiz=false){
  const wrap = document.createElement('div');
  wrap.className = 'tree-node-wrap' + (n.hijos.length && n._open ? ' has-children' : '');
  wrap.dataset.id = n.id;

  // Tarjeta
  const card = document.createElement('div');
  card.className = 'node-card' + (esRaiz?' raiz':'') + (!n.activo?' vacante':'');

  // Avatar
  if(n.foto){
    const img = document.createElement('img');
    img.className = 'node-avatar'; img.src = n.foto; img.alt = n.nombre;
    img.onerror = ()=>{ img.replaceWith(avatarPlaceholder(n.nombre)); };
    card.appendChild(img);
  } else {
    card.appendChild(avatarPlaceholder(n.nombre));
  }

  // Nombre
  const nm = document.createElement('div'); nm.className='node-name';
  nm.innerHTML = n.activo ? n.nombre : `<em style="color:var(--text3)">${n.nombre}</em>`;
  card.appendChild(nm);

  // Cargo
  if(n.cargoL1){
    const jb = document.createElement('div'); jb.className='node-job';
    jb.textContent = n.cargoL1;
    card.appendChild(jb);
    if(n.cargoL2){
      const jb2 = document.createElement('div'); jb2.className='node-job';
      jb2.textContent = n.cargoL2;
      card.appendChild(jb2);
    }
  }

  // División
  if(n.div){
    const dv = document.createElement('div'); dv.className='node-div';
    dv.textContent = n.div; card.appendChild(dv);
  }

  // Tooltip
  card.addEventListener('mouseenter', e=>showTT(e,n));
  card.addEventListener('mousemove',  e=>moveTT(e));
  card.addEventListener('mouseleave', ()=>hideTT());

  // Click → colapsar/expandir
  if(n.hijos.length){
    card.style.cursor = 'pointer';
    card.addEventListener('click', ()=>{
      n._open = !n._open;
      renderTree();
    });

    // Badge
    if(!n._open){
      const badge = document.createElement('div');
      badge.className = 'node-badge';
      badge.textContent = `+${contar(n.hijos)+n.hijos.length} personas`;
      card.classList.add('collapsed-card');
      wrap.appendChild(card);
      wrap.appendChild(badge);
      return wrap;
    }
  }

  wrap.appendChild(card);

  // Hijos
  if(n.hijos.length && n._open){
    const childRow = document.createElement('div');
    childRow.className = 'tree-children';

    n.hijos.forEach(h=>{
      const cw = document.createElement('div');
      cw.className = 'tree-child-wrap';
      cw.appendChild(buildNode(h));
      childRow.appendChild(cw);
    });

    // Ancho de la barra horizontal = ancho del childRow
    wrap.appendChild(childRow);

    // Ajustar barra horizontal después de render
    requestAnimationFrame(()=>{
      const w = childRow.scrollWidth;
      const firstChild = childRow.querySelector('.tree-child-wrap');
      const lastChild  = childRow.querySelectorAll('.tree-child-wrap');
      if(firstChild && lastChild.length > 1){
        const fc = firstChild.getBoundingClientRect();
        const lc = lastChild[lastChild.length-1].getBoundingClientRect();
        const barW = lc.right - fc.left;
        // centro de cada primer/último hijo
        childRow.style.setProperty('--bar-width', barW+'px');
      } else {
        childRow.style.setProperty('--bar-width', '0px');
      }
    });
  }

  return wrap;
}

function avatarPlaceholder(nombre){
  const el = document.createElement('div');
  el.className = 'node-avatar-placeholder';
  el.textContent = nombre.split(' ').filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join('');
  return el;
}

// ── EXPANDIR / COLAPSAR ───────────────────────────────────────
function setOpen(n, val){ n._open = val; n.hijos.forEach(h=>setOpen(h,val)); }
function expandirTodo(){ if(raiz){setOpen(raiz,true); renderTree();} }
function colapsarTodo(){
  if(!raiz) return;
  raiz._open = true; // raíz siempre visible
  raiz.hijos.forEach(h=>setOpen(h,false));
  renderTree();
}

// ── BÚSQUEDA ──────────────────────────────────────────────────
let searchTO;
function buscar(q){
  clearTimeout(searchTO);
  searchTO = setTimeout(()=>{
    const t = q.toLowerCase().trim();
    document.querySelectorAll('.node-card').forEach(c=>{
      const wrap = c.closest('.tree-node-wrap');
      if(!t){ c.classList.remove('highlight'); if(wrap)wrap.style.opacity='1'; return; }
      const nm  = (c.querySelector('.node-name')?.textContent||'').toLowerCase();
      const job = (c.querySelector('.node-job')?.textContent||'').toLowerCase();
      if(nm.includes(t)||job.includes(t)){
        c.classList.add('highlight'); if(wrap)wrap.style.opacity='1';
      } else {
        c.classList.remove('highlight'); if(wrap)wrap.style.opacity='0.25';
      }
    });
  }, 200);
}

// ── TOOLTIP ───────────────────────────────────────────────────
const tt = document.getElementById('tooltip');
function showTT(e,n){
  document.getElementById('tt-name').textContent = n.nombre;
  document.getElementById('tt-job').textContent  = n.cargo||'';
  document.getElementById('tt-area').textContent = [n.div, n.area].filter(Boolean).join(' · ');
  tt.classList.add('show'); moveTT(e);
}
function moveTT(e){ tt.style.left=(e.clientX+14)+'px'; tt.style.top=(e.clientY-10)+'px'; }
function hideTT(){ tt.classList.remove('show'); }
</script>
