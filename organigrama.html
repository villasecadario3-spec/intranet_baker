<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organigrama — Baker</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.11.1/lib/msal-browser.min.js"></script>
<style>
:root{
  --bg:#16171a;--surface:#1e2025;--surface2:#25272d;
  --border:#2e3038;--border2:#3a3d47;
  --text:#f0f0f2;--text2:#9fa3b0;--text3:#5a5f70;
  --gold:#cc9166;--gold-light:rgba(204,145,102,0.10);
  --radius:12px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow:hidden}

/* NAV */
nav{flex-shrink:0;background:rgba(22,23,26,0.95);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;padding:0 24px;gap:14px;z-index:100}
.nav-logo img{height:24px;background:white;border-radius:5px;padding:3px 8px;display:block}
.nav-sep{width:1px;height:16px;background:var(--border)}
.nav-back{display:flex;align-items:center;gap:5px;color:var(--text2);text-decoration:none;font-size:0.75rem;font-weight:500;transition:color 0.2s}
.nav-back:hover{color:var(--text)}
.nav-back svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.nav-title{font-size:0.7rem;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;font-family:"DM Mono",monospace}
.nav-spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;background:var(--surface2);border:1px solid var(--border);border-radius:100px}
.user-av{width:24px;height:24px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:700;color:#000}
.user-nm{font-size:0.75rem;color:var(--text);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* TOOLBAR */
.toolbar{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search-box{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0 10px;height:32px;transition:border-color 0.15s}
.search-box:focus-within{border-color:var(--gold)}
.search-box svg{width:13px;height:13px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}
.search-box input{background:none;border:none;outline:none;font-size:12px;font-family:"DM Sans",sans-serif;color:var(--text);width:160px}
.search-box input::placeholder{color:var(--text3)}
.btn{display:flex;align-items:center;gap:5px;padding:0 12px;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text2);font-size:12px;font-weight:500;font-family:"DM Sans",sans-serif;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#000;font-weight:600}
.btn.primary:hover{background:#b87d55;border-color:#b87d55;color:#000}
.btn.danger{color:#e74c3c;border-color:#e74c3c}
.btn.danger:hover{background:rgba(231,76,60,0.1)}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 2px}
.stats-inline{display:flex;gap:16px;margin-left:auto}
.stat-inline{font-size:11px;color:var(--text3);font-family:"DM Mono",monospace}
.stat-inline strong{color:var(--gold);font-size:13px}

/* CANVAS */
.canvas-wrap{flex:1;overflow:hidden;cursor:grab;position:relative}
.canvas-wrap.dragging{cursor:grabbing}
.canvas-inner{position:absolute;top:0;left:0;transform-origin:0 0;padding:60px 80px}

/* ── ÁRBOL ───────────────────────────────────────────── */
.tree-node-wrap{display:flex;flex-direction:column;align-items:center;position:relative}
.tree-children{display:flex;flex-direction:row;align-items:flex-start;gap:0;position:relative;margin-top:0}
.tree-children::before{content:'';position:absolute;top:0;height:2px;background:var(--border2);left:var(--bar-l);width:var(--bar-w)}
.tree-child-wrap{display:flex;flex-direction:column;align-items:center;padding:0 14px;position:relative}
.tree-child-wrap::before{content:'';width:2px;height:24px;background:var(--border2);flex-shrink:0}
.connector-down{width:2px;height:24px;background:var(--border2);margin:0 auto}

/* NODO */
.node-card{
  display:flex;flex-direction:column;align-items:center;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:14px 14px 11px;cursor:pointer;
  transition:border-color 0.15s,background 0.15s,box-shadow 0.15s;
  position:relative;width:155px;text-align:center;user-select:none;
}
.node-card:hover{border-color:var(--gold);background:var(--surface2);box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.node-card.raiz{border-color:var(--gold);background:var(--gold-light);box-shadow:0 0 0 3px rgba(204,145,102,0.15)}
.node-card.highlight{border-color:var(--gold);background:var(--gold-light)}
.node-card.vacante{opacity:0.45}
.node-card.collapsed-card{border-style:dashed;opacity:0.8}

.node-av{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--border2);margin-bottom:8px;flex-shrink:0}
.node-av-ph{width:48px;height:48px;border-radius:50%;background:var(--surface2);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--gold);margin-bottom:8px;flex-shrink:0}
.node-name{font-size:11.5px;font-weight:600;line-height:1.3;color:var(--text)}
.node-job{font-size:10px;color:var(--text2);line-height:1.3;margin-top:3px}
.node-div{font-size:9px;color:var(--text3);margin-top:3px;font-family:"DM Mono",monospace}
.node-badge{
  position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);
  background:var(--surface2);border:1px solid var(--border2);border-radius:100px;
  font-size:9.5px;font-family:"DM Mono",monospace;color:var(--text3);
  padding:1px 8px;white-space:nowrap;
}

/* EDIT BUTTON — solo visible en hover para admin */
.node-edit-btn{
  position:absolute;top:6px;right:6px;
  width:20px;height:20px;border-radius:50%;
  background:var(--surface2);border:1px solid var(--border2);
  display:none;align-items:center;justify-content:center;cursor:pointer;
  transition:all 0.15s;z-index:2;
}
.node-edit-btn:hover{background:var(--gold);border-color:var(--gold)}
.node-edit-btn svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.node-card:hover .node-edit-btn.visible{display:flex}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:28px;width:440px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.modal h2 svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;font-size:13px;font-family:"DM Sans",sans-serif;color:var(--text);outline:none;transition:border-color 0.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field select option{background:var(--surface2)}
.field textarea{resize:vertical;min-height:60px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.modal-footer .btn{height:36px}
.alert-modal{background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3);border-radius:8px;padding:10px 14px;font-size:12px;color:#e74c3c;margin-bottom:14px}

/* TOOLTIP */
.tooltip{position:fixed;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;font-size:12px;pointer-events:none;z-index:300;max-width:240px;display:none;line-height:1.5;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.tooltip.show{display:block}
.tt-name{font-weight:600;color:var(--text);margin-bottom:2px}
.tt-job{color:var(--text2)}
.tt-area{color:var(--text3);font-size:11px;margin-top:3px}

/* LOADING */
#auth-loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#auth-loading p{font-size:13px;color:var(--text2)}
#app-content{display:none;flex-direction:column;height:100vh}
</style>
</head>
<body>

<div id="app-content">

  <div class="nav-title">Organigrama</div>
  <div class="nav-spacer"></div>
  <div id="auth-area"></div>
</nav>

<div class="toolbar">
  <div class="search-box">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>

      <button class="btn primary" onclick="guardarNodo()">Guardar</button>
    </div>
  </div>
</div>

<script>
// ── MSAL ──────────────────────────────────────────────────────
const ALLOWED  = ['dvillaseca@ibaker.cl','jcumplido@ibaker.cl'];
const ES_ADMIN = email => email === 'dvillaseca@ibaker.cl';
const msalCfg  = {
  auth:{clientId:'9a56ab1c-d3c4-4460-9892-1d4da768ecfb',authority:'https://login.microsoftonline.com/87c9a653-b08e-42c9-92bc-260458dffc26',redirectUri:window.location.origin+'/'},
  cache:{cacheLocation:'sessionStorage'}
};
let msalInst=null, currentUser=null, isAdmin=false;
window.addEventListener('load',async()=>{
  msalInst=new msal.PublicClientApplication(msalCfg);
  await msalInst.initialize(); await initAuth();
});
async function initAuth(){
  try{
    const resp=await msalInst.handleRedirectPromise();
    let acc=resp?resp.account:msalInst.getAllAccounts()[0];
    if(!acc){await msalInst.loginRedirect({scopes:['User.Read']});return;}
    const email=acc.username.toLowerCase();
    if(!ALLOWED.includes(email)){
      document.getElementById('auth-loading').innerHTML='<div style="text-align:center;padding:2rem"><h2 style="color:#C0392B">Acceso no autorizado</h2></div>';
      return;
    }
    currentUser=email; isAdmin=ES_ADMIN(email);
    const ini=acc.name?acc.name.split(' ').slice(0,2).map(n=>n[0]).join('').toUpperCase():email[0].toUpperCase();
    document.getElementById('auth-area').innerHTML=`<div class="user-chip"><div class="user-av">${ini}</div><div class="user-nm">${acc.name||email}</div></div>`;
    document.getElementById('auth-loading').style.display='none';
    document.getElementById('app-content').style.display='flex';
    if(isAdmin) document.getElementById('btn-add').style.display='flex';
    cargarOrganigrama();
  }catch(e){console.error(e);}
}

// ── NORMALIZAR ────────────────────────────────────────────────
let nextId = 900000;
function norm(n){
  const cargo=n.position_tooltip||[n.position_first_line,n.position_second_line].filter(Boolean).join(' ');
  return {
    id:      n.id||(nextId++),
    nombre:  [n.name,n.last_name].filter(Boolean).join(' ')||'Puesto Vacante',
    cargo, cargoL1:n.position_first_line||'', cargoL2:n.position_second_line||'',
    area:n.department||'', div:n.division||'',
    foto:(n.image&&!n.image.startsWith('/images/'))?n.image:null,
    activo:n.isActive!==false,
    hijos:(n.children||[]).map(norm),
    _open:true
  };
}
function contar(ns){return ns.reduce((a,n)=>a+1+contar(n.hijos),0);}

// Árbol en memoria (editable)
let raiz=null;

function cargarOrganigrama(){
  // Intentar cargar desde localStorage (ediciones previas)
  const saved=localStorage.getItem('baker_org_v1');
  if(saved){try{raiz=JSON.parse(saved);}catch(e){raiz=norm(DATOS_BUK);}}
  else raiz=norm(DATOS_BUK);
  actualizarStats(); renderTree(); centrar();
}

function actualizarStats(){
  const total=1+contar(raiz.hijos);
  const divs=new Set(); const rec=n=>{if(n.div)divs.add(n.div);n.hijos.forEach(rec);}; rec(raiz);
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-div').textContent=divs.size;
}

function guardarLocal(){
  localStorage.setItem('baker_org_v1',JSON.stringify(raiz));
}

// ── RENDER ────────────────────────────────────────────────────
function renderTree(){
  const ci=document.getElementById('canvas-inner');
  ci.innerHTML='';
  ci.appendChild(buildNode(raiz,true));
  // ajustar barras horizontales
  requestAnimationFrame(ajustarBarras);
}

function buildNode(n,esRaiz=false){
  const wrap=document.createElement('div');
  wrap.className='tree-node-wrap';
  wrap.dataset.id=n.id;

  const card=document.createElement('div');
  card.className='node-card'+(esRaiz?' raiz':'')+(n.activo?'':' vacante');

  // Avatar
  if(n.foto){
    const img=document.createElement('img');
    img.className='node-av';img.src=n.foto;img.alt=n.nombre;
    img.onerror=()=>img.replaceWith(mkAvPh(n.nombre));
    card.appendChild(img);
  }else card.appendChild(mkAvPh(n.nombre));

  // Nombre
  const nm=document.createElement('div');nm.className='node-name';
  nm.innerHTML=n.activo?n.nombre:`<em style="color:var(--text3)">${n.nombre}</em>`;
  card.appendChild(nm);

  // Cargo
  if(n.cargoL1){
    const j1=document.createElement('div');j1.className='node-job';j1.textContent=n.cargoL1;card.appendChild(j1);
    if(n.cargoL2){const j2=document.createElement('div');j2.className='node-job';j2.textContent=n.cargoL2;card.appendChild(j2);}
  }

  // División
  if(n.div){const dv=document.createElement('div');dv.className='node-div';dv.textContent=n.div;card.appendChild(dv);}

  // Botón editar (solo admin)
  if(isAdmin){
    const eb=document.createElement('div');eb.className='node-edit-btn visible';
    eb.title='Editar';eb.innerHTML='<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
    eb.addEventListener('click',e=>{e.stopPropagation();abrirModalEditar(n);});
    card.appendChild(eb);
  }

  // Tooltip
  card.addEventListener('mouseenter',e=>showTT(e,n));
  card.addEventListener('mousemove',e=>moveTT(e));
  card.addEventListener('mouseleave',()=>hideTT());

  // Click colapsar
  if(n.hijos.length){
    card.addEventListener('click',()=>{n._open=!n._open;renderTree();});
    if(!n._open){
      card.classList.add('collapsed-card');
      const bg=document.createElement('div');bg.className='node-badge';
      bg.textContent=`▸ ${contar(n.hijos)+n.hijos.length} personas`;
      wrap.appendChild(card);wrap.appendChild(bg);
      return wrap;
    }
  }

  wrap.appendChild(card);

  // Conector hacia hijos
  if(n.hijos.length&&n._open){
    const cd=document.createElement('div');cd.className='connector-down';
    wrap.appendChild(cd);
    const cr=document.createElement('div');cr.className='tree-children';
    n.hijos.forEach(h=>{
      const cw=document.createElement('div');cw.className='tree-child-wrap';
      cw.appendChild(buildNode(h));cr.appendChild(cw);
    });
    wrap.appendChild(cr);
  }
  return wrap;
}

function mkAvPh(nombre){
  const el=document.createElement('div');el.className='node-av-ph';
  el.textContent=nombre.split(' ').filter(Boolean).slice(0,2).map(p=>p[0]?.toUpperCase()||'').join('');
  return el;
}

function ajustarBarras(){
  document.querySelectorAll('.tree-children').forEach(cr=>{
    const hijos=[...cr.querySelectorAll(':scope > .tree-child-wrap')];
    if(hijos.length<2){cr.style.setProperty('--bar-w','0px');cr.style.setProperty('--bar-l','50%');return;}
    const crRect=cr.getBoundingClientRect();
    const fc=hijos[0].getBoundingClientRect();
    const lc=hijos[hijos.length-1].getBoundingClientRect();
    const L=fc.left+fc.width/2-crRect.left;
    const R=lc.left+lc.width/2-crRect.left;
    cr.style.setProperty('--bar-l',L+'px');
    cr.style.setProperty('--bar-w',(R-L)+'px');
  });
}

// ── EXPANDIR / COLAPSAR ───────────────────────────────────────
function setOpen(n,v){n._open=v;n.hijos.forEach(h=>setOpen(h,v));}
function expandirTodo(){if(raiz){setOpen(raiz,true);renderTree();}}
function colapsarTodo(){if(!raiz)return;raiz._open=true;raiz.hijos.forEach(h=>setOpen(h,false));renderTree();}

// ── DRAG & PAN ────────────────────────────────────────────────
const canvasWrap=document.getElementById('canvas-wrap');
const canvasInner=document.getElementById('canvas-inner');
let panX=40,panY=40,scale=1,isDragging=false,startX=0,startY=0;

function applyTransform(){
  canvasInner.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;
}

canvasWrap.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  if(e.target.closest('.node-card')||e.target.closest('.node-edit-btn'))return;
  isDragging=true;startX=e.clientX-panX;startY=e.clientY-panY;
  canvasWrap.classList.add('dragging');
});
window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  panX=e.clientX-startX;panY=e.clientY-startY;applyTransform();
});
window.addEventListener('mouseup',()=>{isDragging=false;canvasWrap.classList.remove('dragging');});

// Zoom rueda
canvasWrap.addEventListener('wheel',e=>{
  e.preventDefault();
  const delta=e.deltaY>0?-0.1:0.1;
  zoom(delta,e.clientX,e.clientY);
},{passive:false});

function zoom(delta,cx,cy){
  const wrap=canvasWrap.getBoundingClientRect();
  cx=cx??wrap.left+wrap.width/2;cy=cy??wrap.top+wrap.height/2;
  const newScale=Math.min(2,Math.max(0.2,scale+delta));
  const ratio=newScale/scale;
  panX=cx-(cx-panX)*ratio;panY=cy-(cy-panY)*ratio;
  scale=newScale;applyTransform();
}

function centrar(){
  const wrap=canvasWrap.getBoundingClientRect();
  scale=0.75;
  requestAnimationFrame(()=>{
    const iw=canvasInner.scrollWidth*scale;
    panX=Math.max(40,(wrap.width-iw)/2);panY=40;applyTransform();
  });
}

// Touch pan
let t0=null;
canvasWrap.addEventListener('touchstart',e=>{if(e.touches.length===1){t0={x:e.touches[0].clientX-panX,y:e.touches[0].clientY-panY};}},{passive:true});
canvasWrap.addEventListener('touchmove',e=>{if(e.touches.length===1&&t0){panX=e.touches[0].clientX-t0.x;panY=e.touches[0].clientY-t0.y;applyTransform();}},{passive:true});

// ── BÚSQUEDA ──────────────────────────────────────────────────
let sTO;
function buscar(q){
  clearTimeout(sTO);sTO=setTimeout(()=>{
    const t=q.toLowerCase().trim();
    document.querySelectorAll('.node-card').forEach(c=>{
      const nw=c.closest('.tree-node-wrap');
      if(!t){c.classList.remove('highlight');if(nw)nw.style.opacity='1';return;}
      const txt=(c.querySelector('.node-name')?.textContent||'').toLowerCase()+(c.querySelector('.node-job')?.textContent||'').toLowerCase();
      if(txt.includes(t)){c.classList.add('highlight');if(nw)nw.style.opacity='1';}
      else{c.classList.remove('highlight');if(nw)nw.style.opacity='0.2';}
    });
  },200);
}

// ── TOOLTIP ───────────────────────────────────────────────────
const tt=document.getElementById('tooltip');
function showTT(e,n){
  document.getElementById('tt-name').textContent=n.nombre;
  document.getElementById('tt-job').textContent=n.cargo||'';
  document.getElementById('tt-area').textContent=[n.div,n.area].filter(Boolean).join(' · ');
  tt.classList.add('show');moveTT(e);
}
function moveTT(e){tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY-10)+'px';}
function hideTT(){tt.classList.remove('show');}

// ── MODAL EDITAR/AGREGAR ──────────────────────────────────────
let editandoId=null;

function todasLasPersonas(n,lista=[]){
  lista.push({id:n.id,nombre:n.nombre,cargo:n.cargoL1});
  n.hijos.forEach(h=>todasLasPersonas(h,lista));
  return lista;
}

function poblarSelectJefe(excluirId=null){
  const sel=document.getElementById('f-jefe');
  sel.innerHTML='<option value="">— Sin jefatura (nivel raíz) —</option>';
  todasLasPersonas(raiz).forEach(p=>{
    if(p.id==excluirId)return;
    const opt=document.createElement('option');
    opt.value=p.id;
    opt.textContent=`${p.nombre} — ${p.cargo||'sin cargo'}`;
    sel.appendChild(opt);
  });
}

function abrirModalNuevo(){
  editandoId=null;
  document.getElementById('modal-title').textContent='Agregar persona';
  document.getElementById('btn-eliminar').style.display='none';
  document.getElementById('modal-alert').style.display='none';
  ['f-name','f-last','f-cargo1','f-cargo2','f-area','f-foto'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-div').value='Inmobiliaria Baker';
  document.getElementById('f-activo').value='true';
  poblarSelectJefe();
  document.getElementById('f-jefe').value='';
  document.getElementById('modal-bg').style.display='flex';
}

function abrirModalEditar(n){
  editandoId=n.id;
  document.getElementById('modal-title').textContent='Editar persona';
  document.getElementById('btn-eliminar').style.display='flex';
  document.getElementById('modal-alert').style.display='none';
  document.getElementById('f-name').value=n.nombre.split(' ').slice(0,-1).join(' ')||'';
  document.getElementById('f-last').value=n.nombre.split(' ').pop()||'';
  document.getElementById('f-cargo1').value=n.cargoL1||'';
  document.getElementById('f-cargo2').value=n.cargoL2||'';
  document.getElementById('f-div').value=n.div||'';
  document.getElementById('f-area').value=n.area||'';
  document.getElementById('f-foto').value=n.foto||'';
  document.getElementById('f-activo').value=n.activo?'true':'false';
  poblarSelectJefe(n.id);
  // Encontrar el padre actual
  const padre=encontrarPadre(raiz,n.id);
  document.getElementById('f-jefe').value=padre?padre.id:'';
  document.getElementById('modal-bg').style.display='flex';
}

function cerrarModal(){document.getElementById('modal-bg').style.display='none';}

function encontrarNodo(n,id){if(n.id==id)return n;for(const h of n.hijos){const r=encontrarNodo(h,id);if(r)return r;}return null;}
function encontrarPadre(n,id){for(const h of n.hijos){if(h.id==id)return n;const r=encontrarPadre(h,id);if(r)return r;}return null;}

function eliminarDeArbol(n,id){
  n.hijos=n.hijos.filter(h=>h.id!=id);
  n.hijos.forEach(h=>eliminarDeArbol(h,id));
}

function guardarNodo(){
  const nombre=(document.getElementById('f-name').value.trim()+' '+document.getElementById('f-last').value.trim()).trim();
  const cargo1=document.getElementById('f-cargo1').value.trim();
  if(!nombre||!cargo1){
    const al=document.getElementById('modal-alert');
    al.textContent='Nombre y cargo son obligatorios.';al.style.display='block';return;
  }
  const foto=document.getElementById('f-foto').value.trim();
  const jefeId=document.getElementById('f-jefe').value;
  const activo=document.getElementById('f-activo').value==='true';
  const cargo2=document.getElementById('f-cargo2').value.trim();
  const cargo=[cargo1,cargo2].filter(Boolean).join(' ');

  if(editandoId!==null){
    // Editar existente
    const nodo=encontrarNodo(raiz,editandoId);
    if(!nodo)return;
    const viejoPadre=encontrarPadre(raiz,editandoId);
    const nuevoPadreId=jefeId?parseInt(jefeId):null;
    const mismoJefe=viejoPadre?(viejoPadre.id==nuevoPadreId):!nuevoPadreId;

    nodo.nombre=nombre;nodo.cargoL1=cargo1;nodo.cargoL2=cargo2;nodo.cargo=cargo;
    nodo.div=document.getElementById('f-div').value;
    nodo.area=document.getElementById('f-area').value.trim();
    nodo.foto=foto||null;nodo.activo=activo;

    // Mover si cambió el jefe
    if(!mismoJefe){
      // Quitar del padre viejo
      eliminarDeArbol(raiz,editandoId);
      // Reinsertar (con sus hijos intactos, ya guardados en nodo)
      // nodo sigue siendo el mismo objeto
      if(nuevoPadreId){
        const nuevoPadre=encontrarNodo(raiz,nuevoPadreId);
        if(nuevoPadre){nuevoPadre.hijos.push(nodo);nuevoPadre._open=true;}
      } else {
        // Hacerlo hijo de la raíz
        raiz.hijos.push(nodo);
      }
    }
  } else {
    // Nuevo nodo
    const nodo={
      id:nextId++,
      nombre,cargo,cargoL1:cargo1,cargoL2:cargo2,
      div:document.getElementById('f-div').value,
      area:document.getElementById('f-area').value.trim(),
      foto:foto||null,activo,hijos:[],_open:true
    };
    const jefeIdInt=jefeId?parseInt(jefeId):null;
    if(jefeIdInt){
      const padre=encontrarNodo(raiz,jefeIdInt);
      if(padre){padre.hijos.push(nodo);padre._open=true;}
    } else {
      raiz.hijos.push(nodo);
    }
  }

  guardarLocal();actualizarStats();renderTree();cerrarModal();
}

function eliminarNodo(){
  if(!editandoId)return;
  if(!confirm('¿Eliminar esta persona del organigrama? Sus subordinados quedarán sin jefatura.'))return;
  const nodo=encontrarNodo(raiz,editandoId);
  if(!nodo)return;
  const padre=encontrarPadre(raiz,editandoId);
  // Los hijos del nodo eliminado pasan al padre
  if(padre){
    padre.hijos=padre.hijos.filter(h=>h.id!=editandoId);
    nodo.hijos.forEach(h=>padre.hijos.push(h));
  } else {
    // Era hijo directo de raíz
    raiz.hijos=raiz.hijos.filter(h=>h.id!=editandoId);
    nodo.hijos.forEach(h=>raiz.hijos.push(h));
  }
  guardarLocal();actualizarStats();renderTree();cerrarModal();
}
</script>
